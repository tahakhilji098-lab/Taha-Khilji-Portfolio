<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchStore = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchStore;
            },
            set: function(val) {
              fetchStore = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if redefinition is constrained
        }
      })();
    </script>
